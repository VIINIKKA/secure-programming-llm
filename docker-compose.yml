services:
  ollama:
    image: ollama/ollama:latest
    container_name: secure-llm-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_net

  ollama-init:
    image: ollama/ollama:latest
    container_name: secure-llm-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull \"$OLLAMA_MODEL\""]
    restart: "no"
    networks:
      - app_net
    profiles:
      - init

  backend:
    build:
      context: ./backend
    container_name: secure-llm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
    container_name: secure-llm-frontend
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:-}
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - app_net

volumes:
  ollama_data:

networks:
  app_net:
    driver: bridge
