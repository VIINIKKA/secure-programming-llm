services:
  ollama:
    image: ollama/ollama:latest
    container_name: secure-llm-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_net

  ollama-init:
    image: ollama/ollama:latest
    container_name: secure-llm-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull \"$OLLAMA_MODEL\""]
    restart: "no"
    networks:
      - app_net
    profiles:
      - init

  backend:
    build:
      context: ./backend
    container_name: secure-llm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
    container_name: secure-llm-frontend
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

volumes:
  ollama_data:

networks:
  app_net:
    driver: bridge
